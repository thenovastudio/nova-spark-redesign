<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <!-- Dashboard frame -->
  <rect x="100" y="80" width="600" height="440" rx="16" fill="#141414" stroke="#2a2a2a" stroke-width="1.5"/>
  <!-- Top bar -->
  <rect x="100" y="80" width="600" height="52" rx="16" fill="#1a1a1a"/>
  <rect x="100" y="116" width="600" height="1" fill="#2a2a2a"/>
  <!-- Window dots -->
  <circle cx="128" cy="106" r="6" fill="#ff5f57"/>
  <circle cx="148" cy="106" r="6" fill="#febc2e"/>
  <circle cx="168" cy="106" r="6" fill="#28c840"/>
  
  <!-- CodevioBox Logo — CODE text -->
  <text x="355" y="112" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="end" letter-spacing="0.5">CODE</text>
  <!-- VIO on gold box -->
  <rect x="357" y="97" width="36" height="20" rx="3" fill="#c9982e"/>
  <text x="375" y="112" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="0.5">VIO</text>
  <!-- Envelope icon -->
  <rect x="398" y="97" width="26" height="18" rx="3" fill="#c9982e"/>
  <polyline points="398,97 411,108 424,97" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linejoin="round"/>
  <line x1="398" y1="115" x2="406" y2="107" stroke="#ffffff" stroke-width="1.2"/>
  <line x1="424" y1="115" x2="416" y2="107" stroke="#ffffff" stroke-width="1.2"/>
  
  <!-- Sidebar -->
  <rect x="100" y="132" width="160" height="388" fill="#111111"/>
  <rect x="260" y="132" width="1" height="388" fill="#2a2a2a"/>
  <!-- Sidebar items -->
  <rect x="120" y="152" width="120" height="36" rx="8" fill="#d4a853" fill-opacity="0.12"/>
  <rect x="136" y="164" width="14" height="12" rx="3" fill="#d4a853"/>
  <text x="158" y="174" fill="#d4a853" font-family="system-ui" font-size="12" font-weight="500">Inbox</text>
  <circle cx="228" cy="170" r="10" fill="#d4a853"/>
  <text x="228" y="174" fill="#0a0a0a" font-family="system-ui" font-size="9" font-weight="700" text-anchor="middle">3</text>
  
  <rect x="136" y="204" width="14" height="12" rx="3" fill="#555"/>
  <text x="158" y="214" fill="#666" font-family="system-ui" font-size="12">Verzonden</text>
  <rect x="136" y="236" width="14" height="12" rx="3" fill="#555"/>
  <text x="158" y="246" fill="#666" font-family="system-ui" font-size="12">Archief</text>
  
  <!-- Message list -->
  <rect x="280" y="148" width="200" height="72" rx="8" fill="#1e1e1e" stroke="#d4a853" stroke-width="1" stroke-opacity="0.3"/>
  <rect x="296" y="162" width="100" height="10" rx="3" fill="#e0e0e0"/>
  <rect x="296" y="180" width="160" height="8" rx="3" fill="#555"/>
  <rect x="296" y="194" width="120" height="8" rx="3" fill="#444"/>
  <circle cx="464" cy="170" r="5" fill="#d4a853"/>
  
  <rect x="280" y="232" width="200" height="72" rx="8" fill="#181818"/>
  <rect x="296" y="246" width="80" height="10" rx="3" fill="#ccc"/>
  <rect x="296" y="264" width="150" height="8" rx="3" fill="#444"/>
  <rect x="296" y="278" width="110" height="8" rx="3" fill="#333"/>
  
  <rect x="280" y="316" width="200" height="72" rx="8" fill="#181818"/>
  <rect x="296" y="330" width="90" height="10" rx="3" fill="#ccc"/>
  <rect x="296" y="348" width="140" height="8" rx="3" fill="#444"/>
  <rect x="296" y="362" width="100" height="8" rx="3" fill="#333"/>
  
  <!-- Detail panel -->
  <rect x="500" y="132" width="1" height="388" fill="#2a2a2a"/>
  <rect x="520" y="158" width="120" height="14" rx="4" fill="#e0e0e0"/>
  <rect x="520" y="182" width="80" height="10" rx="3" fill="#d4a853" fill-opacity="0.6"/>
  <rect x="520" y="210" width="150" height="1" fill="#2a2a2a"/>
  <rect x="520" y="230" width="140" height="8" rx="3" fill="#555"/>
  <rect x="520" y="248" width="150" height="8" rx="3" fill="#444"/>
  <rect x="520" y="266" width="120" height="8" rx="3" fill="#444"/>
  <rect x="520" y="284" width="145" height="8" rx="3" fill="#444"/>
  <rect x="520" y="302" width="100" height="8" rx="3" fill="#444"/>
  <!-- Reply button -->
  <rect x="520" y="340" width="100" height="34" rx="8" fill="#d4a853"/>
  <text x="570" y="362" fill="#0a0a0a" font-family="system-ui" font-size="12" font-weight="600" text-anchor="middle">Antwoord</text>
</svg>
