<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <rect width="800" height="600" fill="#0c0c0c"/>
  <!-- Email client frame -->
  <rect x="80" y="60" width="640" height="480" rx="16" fill="#141414" stroke="#2a2a2a" stroke-width="1.5"/>
  <!-- Top bar -->
  <rect x="80" y="60" width="640" height="52" rx="16" fill="#1a1a1a"/>
  <rect x="80" y="96" width="640" height="1" fill="#2a2a2a"/>
  <!-- Window dots -->
  <circle cx="108" cy="86" r="6" fill="#ff5f57"/>
  <circle cx="128" cy="86" r="6" fill="#febc2e"/>
  <circle cx="148" cy="86" r="6" fill="#28c840"/>
  <!-- Title -->
  <text x="400" y="92" fill="#8b5cf6" font-family="system-ui" font-size="14" font-weight="600" text-anchor="middle">Novail</text>
  
  <!-- Sidebar -->
  <rect x="80" y="112" width="140" height="428" fill="#111111"/>
  <rect x="220" y="112" width="1" height="428" fill="#2a2a2a"/>
  
  <!-- Sidebar — compose button -->
  <rect x="96" y="124" width="108" height="32" rx="8" fill="#8b5cf6"/>
  <text x="150" y="145" fill="#fff" font-family="system-ui" font-size="11" font-weight="600" text-anchor="middle">+ Compose</text>
  
  <!-- Sidebar labels -->
  <rect x="96" y="172" width="12" height="10" rx="2" fill="#8b5cf6" fill-opacity="0.5"/>
  <text x="116" y="181" fill="#8b5cf6" font-family="system-ui" font-size="11" font-weight="500">Inbox</text>
  <text x="196" y="181" fill="#8b5cf6" font-family="system-ui" font-size="10" font-weight="700">12</text>
  
  <rect x="96" y="198" width="12" height="10" rx="2" fill="#444"/>
  <text x="116" y="207" fill="#666" font-family="system-ui" font-size="11">Starred</text>
  <rect x="96" y="224" width="12" height="10" rx="2" fill="#444"/>
  <text x="116" y="233" fill="#666" font-family="system-ui" font-size="11">Sent</text>
  <rect x="96" y="250" width="12" height="10" rx="2" fill="#444"/>
  <text x="116" y="259" fill="#666" font-family="system-ui" font-size="11">Drafts</text>
  
  <!-- Custom label section -->
  <rect x="96" y="290" width="108" height="1" fill="#2a2a2a"/>
  <text x="96" y="312" fill="#555" font-family="system-ui" font-size="9" font-weight="600" letter-spacing="1">LABELS</text>
  <circle cx="102" cy="332" r="4" fill="#22c55e"/>
  <text x="116" y="336" fill="#777" font-family="system-ui" font-size="10">Personal</text>
  <circle cx="102" cy="354" r="4" fill="#f59e0b"/>
  <text x="116" y="358" fill="#777" font-family="system-ui" font-size="10">Work</text>
  <circle cx="102" cy="376" r="4" fill="#ef4444"/>
  <text x="116" y="380" fill="#777" font-family="system-ui" font-size="10">Urgent</text>
  
  <!-- Email list area -->
  <!-- Search bar -->
  <rect x="236" y="118" width="468" height="36" rx="8" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
  <text x="256" y="141" fill="#555" font-family="system-ui" font-size="12">Search emails...</text>
  
  <!-- Email rows -->
  <rect x="236" y="168" width="468" height="64" rx="0" fill="#1e1e1e"/>
  <rect x="236" y="168" width="3" height="64" fill="#8b5cf6"/>
  <circle cx="260" cy="192" r="4" fill="#8b5cf6"/>
  <rect x="276" y="182" width="100" height="10" rx="3" fill="#e8e8e8"/>
  <rect x="276" y="198" width="200" height="8" rx="3" fill="#666"/>
  <text x="660" y="192" fill="#555" font-family="system-ui" font-size="10" text-anchor="end">10:32</text>
  
  <rect x="236" y="233" width="468" height="1" fill="#1e1e1e"/>
  <rect x="236" y="234" width="468" height="64" fill="transparent"/>
  <rect x="276" y="250" width="80" height="10" rx="3" fill="#ccc"/>
  <rect x="276" y="266" width="180" height="8" rx="3" fill="#555"/>
  <text x="660" y="260" fill="#555" font-family="system-ui" font-size="10" text-anchor="end">09:15</text>
  
  <rect x="236" y="299" width="468" height="1" fill="#1e1e1e"/>
  <rect x="236" y="300" width="468" height="64" fill="transparent"/>
  <rect x="276" y="316" width="90" height="10" rx="3" fill="#ccc"/>
  <rect x="276" y="332" width="160" height="8" rx="3" fill="#555"/>
  <text x="660" y="326" fill="#555" font-family="system-ui" font-size="10" text-anchor="end">Yesterday</text>
  
  <rect x="236" y="365" width="468" height="1" fill="#1e1e1e"/>
  <rect x="236" y="366" width="468" height="64" fill="transparent"/>
  <rect x="276" y="382" width="110" height="10" rx="3" fill="#ccc"/>
  <rect x="276" y="398" width="190" height="8" rx="3" fill="#555"/>
  <text x="660" y="392" fill="#555" font-family="system-ui" font-size="10" text-anchor="end">May 6</text>
  
  <rect x="236" y="431" width="468" height="1" fill="#1e1e1e"/>
  <rect x="236" y="432" width="468" height="64" fill="transparent"/>
  <rect x="276" y="448" width="70" height="10" rx="3" fill="#ccc"/>
  <rect x="276" y="464" width="170" height="8" rx="3" fill="#555"/>
  <text x="660" y="458" fill="#555" font-family="system-ui" font-size="10" text-anchor="end">May 5</text>
  
  <!-- Customization accent — theme color bar at bottom -->
  <rect x="80" y="524" width="640" height="16" rx="0" fill="url(#novailGrad)"/>
  <defs>
    <linearGradient id="novailGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
</svg>
